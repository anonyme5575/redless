name: APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write # to publish the APK in the « latest » release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configuration du classement mondial (secrets facultatifs)
        run: node scripts/online-config.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - run: android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: redless-apk
          path: dist/redless.apk
      # Fixed download link used by the « Mettre à jour » button of the Android app:
      # https://github.com/anonyme5575/redless/releases/download/latest/redless.apk
      - name: Publier l'APK (release « latest »)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Redless (dernière version)
          body: "Dernière version de Redless pour Android. Télécharge redless.apk et installe-le par-dessus l'ancien : ta progression est gardée."
          files: dist/redless.apk
          make_latest: true
