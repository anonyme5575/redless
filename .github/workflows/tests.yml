name: Tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Parcours de connexion (Supabase simulé)
        run: node tests/login.test.mjs
      - name: Mode Chaos (rotation, événements, mini-jeu de la poule)
        run: node tests/chaos.test.mjs
      - name: Tempo (départ lent, croissance exponentielle sans plafond)
        run: node tests/tempo.test.mjs
