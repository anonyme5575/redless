<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Bannière Play Store</title>
<style>
@font-face { font-family: "Oxanium"; src: url("../fonts/oxanium.woff2") format("woff2"); font-weight: 200 800; }
@font-face { font-family: "Chakra Petch"; src: url("../fonts/chakra-700.woff2") format("woff2"); font-weight: 700; }
html, body { margin: 0; background: #040a11; }
.fg { position: relative; width: 1024px; height: 500px; overflow: hidden; color: #d9f4ff; font-family: "Chakra Petch", sans-serif; }
.fg::before { content: ""; position: absolute; inset: 0; background: url("../assets/city.jpg") center 35% / cover; opacity: .5; }
.fg::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.04) 0 1px, transparent 1px 3px), radial-gradient(110% 100% at 30% 50%, transparent 40%, rgba(0,0,0,.75)); }
.txt { position: absolute; left: 64px; top: 112px; z-index: 2; }
h1 { margin: 0; font-family: "Oxanium", sans-serif; font-weight: 800; font-size: 100px; line-height: .95; letter-spacing: .04em; text-transform: uppercase; text-shadow: 0 0 22px rgba(54,201,255,.6); }
h1 span { color: #ff2d55; text-shadow: 0 0 26px #ff2d55; }
p { margin: 22px 0 0; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; color: #36c9ff; }
.grid { position: absolute; right: 70px; top: 70px; z-index: 2; display: grid; grid-template-columns: repeat(3, 104px); gap: 14px; }
.grid i { height: 104px; background: rgba(54,201,255,.08); clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
.g { background: linear-gradient(160deg, #2bff8a, #18914f) !important; }
.r { background: linear-gradient(160deg, #ff2d55, #911a30) !important; }
.y { background: linear-gradient(160deg, #ffc84a, #91722a) !important; }
.frame { position: absolute; inset: 22px; z-index: 3; border: 2px solid #36c9ff; clip-path: polygon(30px 0, calc(100% - 30px) 0, 100% 30px, 100% calc(100% - 30px), calc(100% - 30px) 100%, 30px 100%, 0 calc(100% - 30px), 0 30px); box-shadow: 0 0 20px rgba(54,201,255,.5) inset; }
</style></head>
<body><div class="fg"><div class="txt"><h1><span>Red</span>less</h1><p>Touche le vert · jamais le rouge</p></div>
<div class="grid"><i class="g"></i><i></i><i class="r"></i><i></i><i class="g"></i><i class="y"></i><i class="r"></i><i class="g"></i><i></i></div><div class="frame"></div></div></body></html>
